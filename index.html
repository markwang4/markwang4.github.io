<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Wang</title>
  <meta name="description" content="Mark Wang — AI researcher.">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: -0.006em;
      overflow-x: hidden;
    }

    main {
      width: min(1060px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 570px) minmax(300px, 1fr);
      gap: 72px;
      align-items: center;
      padding: 72px 0;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    p {
      margin: 0 0 20px;
      max-width: 560px;
    }

    .secondary {
      color: #666;
      margin-bottom: 0;
    }

    .visual {
      position: relative;
      width: 100%;
      height: min(56vh, 500px);
      min-height: 360px;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 760px) {
      main {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 32px;
        align-items: start;
        padding: 14vh 0 48px;
      }

      .visual {
        height: 300px;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Mark Wang</h1>

      <p>
        I’m an AI researcher interested in post-training, reasoning, and forecasting.
        I care about building learning systems that improve reliably from weak or
        imperfect supervision.
      </p>

      <p class="secondary">
        Previously, I worked across quantitative research, trading, and applied machine learning.
      </p>
    </section>

    <div class="visual" aria-hidden="true">
      <canvas id="viz"></canvas>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("viz");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let w = 0, h = 0, dpr = 1;
      let t0 = performance.now();
      let mx = 0, my = 0;

      const paths = [
        { phase: 0.0, amp: 0.22, speed: 0.00042, offset: -0.20, alpha: 0.92 },
        { phase: 1.2, amp: 0.17, speed: 0.00034, offset: -0.08, alpha: 0.54 },
        { phase: 2.1, amp: 0.20, speed: 0.00039, offset:  0.06, alpha: 0.38 },
        { phase: 3.0, amp: 0.15, speed: 0.00031, offset:  0.18, alpha: 0.24 },
        { phase: 4.0, amp: 0.12, speed: 0.00046, offset:  0.30, alpha: 0.16 }
      ];

      function resize() {
        const r = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = r.width;
        h = r.height;
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function curveY(xNorm, p, time) {
        const drift = Math.sin(time * p.speed + p.phase) * 0.055;
        const wave1 = Math.sin(xNorm * 5.2 + time * p.speed * 2.1 + p.phase) * p.amp;
        const wave2 = Math.sin(xNorm * 11.0 - time * p.speed * 1.2 + p.phase * 1.7) * p.amp * 0.25;
        const converge = Math.pow(Math.abs(xNorm - 0.5) * 2, 1.35);
        return 0.5 + p.offset * converge + wave1 * (0.34 + 0.66 * converge) + wave2 + drift;
      }

      function drawPath(p, time) {
        ctx.beginPath();

        const steps = 90;
        for (let i = 0; i <= steps; i++) {
          const xn = i / steps;
          const yn = curveY(xn, p, time);

          const px = xn * w;
          const pointerBend = (mx / Math.max(w,1) - 0.5) * 10 * Math.sin(xn * Math.PI);
          const py = yn * h + pointerBend + (my / Math.max(h,1) - 0.5) * 3;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        ctx.strokeStyle = `rgba(17,17,17,${p.alpha})`;
        ctx.lineWidth = p.alpha > 0.8 ? 1.15 : 0.8;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }

      function drawParticles(time) {
        const count = 7;

        for (let i = 0; i < count; i++) {
          const p = paths[i % paths.length];
          const xNorm = ((time * (0.000025 + i * 0.000003)) + i * 0.137) % 1;
          const yNorm = curveY(xNorm, p, time);

          const x = xNorm * w;
          const y = yNorm * h;

          const pulse = 0.85 + 0.35 * Math.sin(time * 0.0012 + i * 1.3);
          const radius = i === 0 ? 2.1 * pulse : 1.25 * pulse;

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? "rgba(17,17,17,0.95)" : "rgba(17,17,17,0.48)";
          ctx.fill();
        }
      }

      function drawAnchor(time) {
        const xNorm = 0.52 + Math.sin(time * 0.00018) * 0.035;
        const yNorm = curveY(xNorm, paths[0], time);

        const x = xNorm * w;
        const y = yNorm * h;

        ctx.beginPath();
        ctx.arc(x, y, 18 + Math.sin(time * 0.001) * 2.5, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(17,17,17,0.10)";
        ctx.lineWidth = 0.8;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, 3.0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(17,17,17,0.95)";
        ctx.fill();
      }

      function frame(now) {
        ctx.clearRect(0, 0, w, h);
        const time = reduce ? 4200 : now - t0;

        for (const p of paths) drawPath(p, time);
        drawParticles(time);
        drawAnchor(time);

        if (!reduce) requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (e) => {
        const r = canvas.getBoundingClientRect();
        mx = e.clientX - r.left;
        my = e.clientY - r.top;
      });

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
